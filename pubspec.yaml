name: pos_system
description: 'A new Flutter project.'
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  khqr_sdk: ^1.0.6
  go_router: ^18.1.1
  firebase_auth: ^7.0.1
  provider: ^6.1.5+1
  firebase_core: ^5.1.0
  http_parser: ^4.1.2
  device_preview: ^1.3.1
  skeletonizer: ^3.0.0
  http: ^1.2.2
  path_provider: ^2.1.4
  hyper_render_clipboard: ^1.7.3
  super_clipboard: ^0.10.0-dev.2
  mobile_scanner: ^7.4.2
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^17.2.3
  flutter_native_splash: ^2.4.8
  cached_network_image: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/products/
    - assets/fonts/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

    - family: Battambang
      fonts:
        - asset: assets/fonts/Battambang-Regular.ttf
          weight: 400
        - asset: assets/fonts/Battambang-Bold.ttf
          weight: 700

# ═══════════════════════════════════════════════════════════════
# Splash screen config — color-only (no image files required)
# ═══════════════════════════════════════════════════════════════
flutter_native_splash:
  # Light mode — matches your app's light background
  color: "#E2ECE6"

  # Dark mode — matches your app's dark background
  color_dark: "#121212"

  # Android 12+ requires these — otherwise you'll get a white flash
  # on modern Android devices, even with color_dark set above.
  android_12:
    color: "#E2ECE6"
    color_dark: "#121212"

  ios: true
  android: true
  web: false

  fullscreen: false